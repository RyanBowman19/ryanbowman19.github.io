<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Bowsites</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230F2233'/%3E%3Cpath d='M9 8h7.5a5.2 5.2 0 0 1 2.1 9.95A5.6 5.6 0 0 1 17 24H9z' fill='none' stroke='%23E08A1E' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/styles.css">
<style>
  .nf {
    min-height: 100svh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: var(--s-6);
  }
  .nf-inner { max-width: 34rem; }
  .nf-code {
    font-family: var(--font-display);
    font-size: clamp(4rem, 14vw, 7rem);
    line-height: 1;
    letter-spacing: -.04em;
    color: var(--accent);
    margin-bottom: var(--s-4);
  }
  .nf h1 { font-size: var(--fs-700); margin-bottom: var(--s-4); }
  .nf p { color: var(--text-muted); margin-bottom: var(--s-6); }
  .nf-actions { display: flex; flex-wrap: wrap; gap: var(--s-3); justify-content: center; }
</style>
</head>
<body>
<main class="nf">
  <div class="nf-inner">
    <p class="nf-code">404</p>
    <h1>That page isn't here</h1>
    <p>
      Either the link is wrong or the page moved. Nothing you did.
      Head back to the start and you'll find what you're after.
    </p>
    <div class="nf-actions">
      <a class="btn btn-primary btn-lg" href="/">Back to the homepage</a>
      <a class="btn btn-ghost btn-lg" href="/#contact">Get in touch</a>
    </div>
  </div>
</main>
</body>
</html>
